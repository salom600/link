# ============================================================================
# LinkOS — GitHub Actions CI/CD Pipeline
# ----------------------------------------------------------------------------
# Builds a bootable Arch Linux ISO using mkarchiso inside an Arch container.
# Key design decisions to stay within the 6-hour free-tier limit:
#   1. Parallel package downloads (ParallelDownloads=8 in pacman.conf)
#   2. Layer caching for /var/cache/pacman/pkg AND the archiso work/ dir
#   3. ZSTD compression (much faster than xz, slightly larger ISO)
#   4. Pre-built AUR packages via chaotic-aur (skip local compilation)
#   5. Multi-threaded squashfs via zstd -T0
#   6. Auto-publish to GitHub Releases on tags + on every push to main
# ============================================================================
name: Build LinkOS ISO

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (if not tag-driven)'
        required: false
        default: ''

env:
  ISO_NAME: linkos
  ARCH: x86_64
  # Compression: zstd is ~3-4x faster than xz; level 15 = good ratio + still fast.
  # This single setting is the difference between 6h timeout and ~3h build.
  ISOLINUX_BIN: /usr/lib/syslinux/bios/isolinux.bin
  EFI_BOOT_IMG_DIR: /usr/lib/syslinux/efi64/

permissions:
  contents: write   # needed for gh release create
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build the ISO
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build ISO (archiso)
    runs-on: ubuntu-latest
    timeout-minutes: 350   # ~5h50m, leaves 10m buffer under the 6h hard cap
    container:
      image: archlinux:latest
      options: --privileged --device /dev/fuse
    outputs:
      iso_filename: ${{ steps.package.outputs.iso_filename }}
      iso_size_mb:  ${{ steps.package.outputs.iso_size_mb }}
      sha256:       ${{ steps.package.outputs.sha256 }}

    steps:
      # ────── 1. Bootstrap the container ──────
      - name: Bootstrap Arch container
        run: |
          echo "::group::Booting pacman keyring"
          pacman-key --init
          pacman-key --populate archlinux
          # Pull in latest keyring + mirrors BEFORE anything else
          pacman -Sy --noconfirm --needed archlinux-keyring reflector
          reflector \
            --latest 30 \
            --protocol https \
            --sort rate \
            --save /etc/pacman.d/mirrorlist
          echo "::endgroup::"

      # ────── 2. Checkout the repo ──────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ────── 3. Layer cache: pacman packages ──────
      # Caching /var/cache/pacman/pkg dramatically cuts install time on
      # subsequent runs (from ~25min → ~3min). Keyed on the package list
      # hash so cache invalidates only when packages change.
      - name: Cache pacman packages
        uses: actions/cache@v4
        id: cache-pkg
        with:
          path: /var/cache/pacman/pkg
          key: pacman-x86_64-${{ hashFiles('packages.x86_64', 'pacman.conf') }}
          restore-keys: |
            pacman-x86_64-

      # ────── 4. Layer cache: archiso work directory ──────
      # The work/ dir contains the built rootfs. mkarchiso is incremental —
      # if work/ already exists, it skips re-extracting base packages.
      - name: Cache archiso work directory
        uses: actions/cache@v4
        id: cache-work
        with:
          path: work
          key: archiso-work-${{ hashFiles('packages.x86_64', 'airootfs/root/customize_airootfs.sh') }}
          restore-keys: |
            archiso-work-

      # ────── 5. Install build dependencies ──────
      - name: Install archiso + tooling
        run: |
          pacman -Syu --noconfirm --needed \
            archiso \
            git \
            github-cli \
            squashfs-tools \
            dosfstools \
            e2fsprogs \
            mtools \
            xorriso \
            grub \
            jq \
            bc \
            zstd \
            xz \
            gzip \
            lz4 \
            parallel \
            reflector \
            python \
            pyalpm

      # ────── 6. Configure chaotic-aur mirror (pre-built AUR) ──────
      # IMPORTANT: chaotic-keyring and chaotic-mirrorlist are themselves hosted
      # in the chaotic-aur repo, so we can't `pacman -S` them — we have to
      # fetch the raw files from chaotic.cx first, import the maintainer's
      # GPG key, install the keyring manually, then enable the repo.
      #
      # The mirror exposes unversioned symlinks (chaotic-keyring.pkg.tar.zst,
      # chaotic-mirrorlist.pkg.tar.zst) that always point to the latest build,
      # so we don't have to track version numbers in this workflow.
      - name: Add chaotic-aur repository
        run: |
          set -euo pipefail
          echo "::group::Fetch chaotic-aur keyring + mirrorlist"
          # 1. Fetch the keyring + mirrorlist packages directly from chaotic.cx
          #    using the unversioned symlinks (always point to latest).
          mkdir -p /tmp/chaotic
          cd /tmp/chaotic
          for pkg in chaotic-keyring chaotic-mirrorlist; do
            # Try the primary CDN first, fall back to the legacy URL
            if ! curl -fL -o "${pkg}.pkg.tar.zst" \
                "https://cdn-mirror.chaotic.cx/chaotic-aur/x86_64/${pkg}.pkg.tar.zst"; then
              echo "Primary CDN failed for ${pkg}, trying fallback..."
              curl -fL -o "${pkg}.pkg.tar.zst" \
                "https://repo.chaotic.cx/x86_64/${pkg}.pkg.tar.zst"
            fi
            # Sanity check: file must be > 1KB (otherwise it's an error page)
            [[ -s "${pkg}.pkg.tar.zst" ]] || {
              echo "ERROR: ${pkg}.pkg.tar.zst is empty — mirror is broken."
              exit 1
            }
            ls -la "${pkg}.pkg.tar.zst"
          done
          echo "::endgroup::"

          echo "::group::Install chaotic-aur keyring + mirrorlist"
          # 2. Install the local packages manually (use -U for local pkg files)
          pacman -U --noconfirm --needed \
            chaotic-keyring.pkg.tar.zst \
            chaotic-mirrorlist.pkg.tar.zst
          echo "::endgroup::"

          echo "::group::Import + sign the chaotic GPG key"
          # 3. Import the maintainer's GPG key (Chaotic-AUR team, ID 3056513887B78AEB)
          #    and locally sign it so pacman trusts packages signed by it.
          pacman-key --recv-keys 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          echo "::endgroup::"

          echo "::group::Enable chaotic-aur + multilib in pacman.conf"
          # 4. Enable multilib (commented out by default in archlinux:latest).
          #    Use a stateful awk so the [multilib] header and its Include line
          #    are both uncommented together.
          awk '
            /^#\[multilib\]/ { sub(/^#/, ""); in_multilib=1; print; next }
            in_multilib && /^#Include = \/etc\/pacman\.d\/mirrorlist/ { sub(/^#/, ""); print; in_multilib=0; next }
            { print }
          ' /etc/pacman.conf > /tmp/pacman.conf.new
          mv /tmp/pacman.conf.new /etc/pacman.conf

          # 5. Append chaotic-aur repo entry (idempotent).
          #    Use the Include directive so we get the chaotic mirrorlist's
          #    ranked servers (more reliable than hard-coding a single CDN).
          if ! grep -q '^\[chaotic-aur\]' /etc/pacman.conf; then
            printf '\n[chaotic-aur]\nInclude = /etc/pacman.d/chaotic-mirrorlist\n' \
              >> /etc/pacman.conf
          fi
          echo "::endgroup::"

          echo "::group::Verify chaotic-aur is reachable"
          # 6. Refresh databases + try resolving a known chaotic package
          #    (brave-bin) to confirm the repo is working before we proceed.
          pacman -Sy
          pacman -Si brave-bin | head -5 || {
            echo "ERROR: brave-bin not found in chaotic-aur — repo setup failed."
            exit 1
          }
          echo "::endgroup::"

      # ────── 6.5. Build AUR-only packages (calamares, proton-ge-custom, ...) ──────
      # Some packages we need (calamares, proton-ge-custom, replay-sorcery,
      # ttf-meslo-nerd-font) are NOT in official repos or chaotic-aur.
      # We must build them from AUR, then PRE-STAGE the built .pkg.tar.zst
      # files in /repo/x86_64/ so mkarchiso's `pacstrap` can install them
      # inside the ISO's airootfs without needing an AUR helper.
      #
      # We use plain `git clone + makepkg` instead of paru/yay because:
      #   1. No AUR helper dependency (paru-bin is itself an AUR package
      #      with libalpm version-pinning issues)
      #   2. Faster (no extra makepkg for the helper itself)
      #   3. Simpler — fewer moving parts
      - name: Build AUR-only packages (calamares, proton-ge-custom, ...)
        run: |
          set -euo pipefail
          echo "::group::Install build prerequisites"
          # base-devel: gcc, make, etc. (makepkg requirement)
          # git: clone AUR repos
          # sudo: needed for `makepkg -s` to install build deps as root
          pacman -S --noconfirm --needed base-devel git sudo

          # Create the builder user (makepkg refuses to run as root)
          if ! id builder &>/dev/null; then
            useradd -m -G wheel -s /bin/bash builder
          fi
          mkdir -p /etc/sudoers.d
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          echo "::endgroup::"

          echo "::group::Build AUR packages"
          # Build each AUR-only package directly via git clone + makepkg.
          # The built .pkg.tar.zst files are copied to /repo/x86_64/ for
          # mkarchiso's pacstrap to find via the [linkos-local] repo.
          mkdir -p /repo/x86_64

          # Use associative array: AUR package name → AUR git URL
          # NOTE: Only `calamares`, `proton-ge-custom-bin`, `replay-sorcery`,
          # and `ttf-meslo-nerd-font-powerlevel10k` exist in AUR.
          # The names `calamares-core`, `calamares-default-settings`,
          # `proton-ge-custom`, and `ttf-meslo-nerd-font` were wrong guesses
          # that don't exist anywhere.
          declare -A AUR_PKGS=(
            [calamares]="https://aur.archlinux.org/calamares.git"
            [proton-ge-custom-bin]="https://aur.archlinux.org/proton-ge-custom-bin.git"
            [replay-sorcery]="https://aur.archlinux.org/replay-sorcery.git"
            [ttf-meslo-nerd-font-powerlevel10k]="https://aur.archlinux.org/ttf-meslo-nerd-font-powerlevel10k.git"
          )

          for pkg in "${!AUR_PKGS[@]}"; do
            url="${AUR_PKGS[$pkg]}"
            echo "─── Building ${pkg} ───"
            cd /tmp
            rm -rf "${pkg}"
            if ! sudo -u builder git clone --depth=1 "${url}" "${pkg}"; then
              echo "WARNING: git clone ${pkg} failed — skipping."
              continue
            fi
            cd "${pkg}"
            chown -R builder:builder .
            # Build the package:
            #   -s          : install missing build deps automatically via sudo
            #   --noconfirm : don't prompt
            #   --skipinteg : skip PGP/checksum checks (we trust AUR maintainers)
            #   --nocheck   : skip test suite (faster; tests need a display sometimes)
            if ! sudo -u builder makepkg -s --noconfirm --skipinteg --nocheck; then
              echo "WARNING: makepkg ${pkg} failed — skipping."
              continue
            fi
            # Copy the built package(s) into the local repo
            cp -v *.pkg.tar.zst /repo/x86_64/ 2>/dev/null || true
          done
          echo "::endgroup::"

          echo "::group::Create local pacman repo"
          cd /repo/x86_64
          if ! compgen -G "*.pkg.tar.zst" > /dev/null; then
            echo "ERROR: No AUR packages were built successfully."
            ls -la
            exit 1
          fi
          # repo-add creates the pacman database (linkos-local.db.tar.zst)
          repo-add linkos-local.db.tar.zst *.pkg.tar.zst
          ls -la
          echo "::endgroup::"

          echo "::group::Patch container's pacman.conf with [linkos-local]"
          # NOTE: The repo's pacman.conf (used by mkarchiso) ALREADY has
          # [linkos-local] — we just need to add it to the container's
          # /etc/pacman.conf so we can verify packages resolvable here.
          if ! grep -q '^\[linkos-local\]' /etc/pacman.conf; then
            awk '
              /^\[core\]/ && !done {
                print "[linkos-local]"
                print "SigLevel = Optional TrustAll"
                print "Server = file:///repo/$arch"
                print ""
                done=1
              }
              { print }
            ' /etc/pacman.conf > /tmp/pacman.conf.new
            mv /tmp/pacman.conf.new /etc/pacman.conf
          fi
          echo "=== Container's pacman.conf (top 30 lines) ==="
          head -30 /etc/pacman.conf
          echo "::endgroup::"

          echo "::group::Verify AUR packages are resolvable"
          pacman -Sy
          for pkg in calamares proton-ge-custom-bin replay-sorcery \
                     ttf-meslo-nerd-font-powerlevel10k; do
            if pacman -Si "${pkg}" >/dev/null 2>&1; then
              echo "✓ ${pkg} — resolvable"
            else
              echo "⚠️ ${pkg} — NOT resolvable (mkarchiso will fail)"
            fi
          done
          echo "::endgroup::"

      # ────── 7. Patch profiledef for fast zstd compression ──────
      # mkarchiso's default iso_version uses current date — fine.
      # We pass -c zstd via build command below.
      - name: Prepare build environment
        run: |
          # Make sure profiledef.sh is executable
          chmod +x profiledef.sh
          # Clean prior output
          mkdir -p work out

          # CRITICAL: Delete mkarchiso's "run_once" marker files from the
          # cached work/ directory. mkarchiso uses these markers to skip
          # already-completed steps. If we don't delete them, mkarchiso
          # will validate options then exit immediately without rebuilding
          # the ISO — leaving out/ empty.
          #
          # We keep the rest of work/ (rootfs, build_date, etc.) so that
          # the expensive pacstrap step is still skipped on cache hits.
          if [[ -d work ]]; then
            echo "Removing mkarchiso run_once markers from cached work/..."
            find work -maxdepth 1 -name 'iso.*' -delete 2>/dev/null || true
            find work -maxdepth 1 -name 'build_mode.*' -delete 2>/dev/null || true
            # Also remove any prior ISO in work/ (mkarchiso writes to out/, but
            # be defensive in case older runs left artifacts)
            find work -name '*.iso' -delete 2>/dev/null || true
          fi

          # Show disk space + available CPUs (helps debug timeouts)
          echo "=== Disk space ==="
          df -h /
          echo "=== CPUs ==="
          nproc
          echo "=== Memory ==="
          free -h

      # ────── 8. Build the ISO ──────
      # Notes:
      #  - -w work       : working directory (cached)
      #  - -o out        : output directory
      #  - -v            : verbose
      #  Compression (zstd -15, multi-threaded) is configured in profiledef.sh
      #  via airootfs_image_tool_options — modern mkarchiso does NOT accept
      #  -c / -X flags on the command line.
      - name: Build ISO with mkarchiso
        env:
          MAKEFLAGS: "-j$(nproc)"
          # SOURCE_DATE_EPOCH must be a Unix epoch INTEGER (not an ISO timestamp).
          # Use the commit time; fall back to "now" if missing.
          SOURCE_DATE_EPOCH: ${{ github.event.head_commit.timestamp && github.event.head_commit.timestamp || '' }}
        run: |
          set -euo pipefail
          # Normalize SOURCE_DATE_EPOCH: GitHub gives us an ISO 8601 string;
          # mkarchiso expects a Unix epoch integer.
          if [[ -n "${SOURCE_DATE_EPOCH:-}" ]] && [[ "${SOURCE_DATE_EPOCH}" == *T* ]]; then
            SOURCE_DATE_EPOCH="$(date -u -d "${SOURCE_DATE_EPOCH}" +%s)"
            export SOURCE_DATE_EPOCH
          elif [[ -z "${SOURCE_DATE_EPOCH:-}" ]]; then
            SOURCE_DATE_EPOCH="$(date -u +%s)"
            export SOURCE_DATE_EPOCH
          fi
          echo "Using SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"
          echo "  → $(date -u -d @${SOURCE_DATE_EPOCH} +%FT%TZ)"

          echo "::group::mkarchiso run"
          mkarchiso -v \
                    -w work \
                    -o out \
                    ./
          echo "::endgroup::"
          echo "=== Output directory contents ==="
          ls -la out/

      # ────── 9. Package + checksum ──────
      - name: Generate checksums + capture metadata
        id: package
        run: |
          set -euo pipefail
          echo "=== Output directory contents ==="
          ls -la out/

          cd out
          ISO_FILE="$(ls *.iso | head -n1)"
          ISO_SIZE_MB="$(du -m "${ISO_FILE}" | cut -f1)"
          SHA256="$(sha256sum "${ISO_FILE}" | awk '{print $1}')"

          echo "iso_filename=${ISO_FILE}"           >> "$GITHUB_OUTPUT"
          echo "iso_size_mb=${ISO_SIZE_MB}"          >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}"                    >> "$GITHUB_OUTPUT"

          # Persist checksum file alongside the ISO
          sha256sum "${ISO_FILE}" > "${ISO_FILE}.sha256"

          echo "=== Build complete ==="
          echo "ISO:  ${ISO_FILE}"
          echo "Size: ${ISO_SIZE_MB} MB"
          echo "SHA:  ${SHA256}"

      # ────── 10. Upload as Actions artifact (always) ──────
      # This is the primary way to grab the ISO from PRs / non-release pushes.
      - name: Upload ISO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkos-iso-${{ github.run_id }}
          path: out/
          retention-days: 14
          compression-level: 0   # ISO is already compressed; double-zip wastes time

      # ────── 11. Prune work/ to keep cache small ──────
      # Only keep the rootfs layer; drop ISO + tmp files so cache stays <2GB.
      - name: Prune work directory before caching
        if: always()
        run: |
          du -sh work || true
          # mkarchiso writes ISO to out/, but some intermediates may be in work/
          rm -f work/*.iso work/*.sha256 2>/dev/null || true
          du -sh work || true

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — Publish to GitHub Releases (only on tags / main pushes)
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Publish to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Download the ISO artifact from the build job
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: linkos-iso-${{ github.run_id }}
          path: iso-artifacts

      - name: Inspect artifact
        run: |
          set -euo pipefail
          ls -la iso-artifacts/
          # GitHub Releases has a 2 GB per-asset limit. Our ISO is ~5 GB,
          # so we split it into ≤ 1.9 GB chunks before uploading to Releases.
          # The Actions artifact (above) keeps the full unsplit ISO.
          cd iso-artifacts
          ISO_FILE="$(ls *.iso | head -n1)"
          ISO_SIZE="$(stat -c %s "${ISO_FILE}")"
          echo "Original ISO size: $((ISO_SIZE / 1024 / 1024)) MB"
          if (( ISO_SIZE > 1900000000 )); then
            echo "ISO > 1.9 GB — splitting into chunks for GitHub Releases..."
            # Split into 1900 MB chunks (just under the 2 GB limit)
            split -b 1900M -d -a 2 "${ISO_FILE}" "${ISO_FILE}.part."
            # Generate a SHA256 manifest so users can verify after reassembly
            sha256sum "${ISO_FILE}" > "${ISO_FILE}.sha256"
            # Write a README explaining how to reassemble (heredoc, no indent)
            cat > README.txt <<EOF
          LinkOS ISO - Reassembly Instructions
          =====================================

          The ISO was split into chunks because it exceeds GitHub's 2 GB
          per-file release limit. To reassemble:

          1. Download all .part.NN files + this README + the .sha256 file
          2. Reassemble the ISO:
             cat ${ISO_FILE}.part.* > ${ISO_FILE}
          3. Verify integrity:
             sha256sum -c ${ISO_FILE}.sha256
          4. Flash to USB:
             sudo dd if=${ISO_FILE} of=/dev/sdX bs=4M status=progress oflag=sync

          Or use Rufus / BalenaEtcher on Windows.
          EOF
            # Remove the original ISO from the upload list (we'll only
            # upload the chunks + manifest + README).
            rm -f "${ISO_FILE}"
            echo "=== Files to upload to Releases ==="
            ls -la
          else
            echo "ISO ≤ 1.9 GB — no splitting needed."
          fi

      # Determine release tag: use the pushed tag if present, otherwise
      # synthesize a rolling tag from the date+commit SHA.
      - name: Compute release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="LinkOS ${TAG}"
            PRERELEASE="false"
          else
            # Rolling release on main
            TAG="nightly"
            TITLE="LinkOS Nightly ($(date -u +%Y-%m-%d))"
            PRERELEASE="true"
          fi
          echo "tag=${TAG}"        >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}"    >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Delete existing nightly tag (rolling release)
        if: steps.tag.outputs.tag == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove the old nightly tag so we can re-create it on the latest commit
          git push --force origin "refs/tags/nightly" || \
          git tag -f nightly && git push --force origin refs/tags/nightly || true

      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          TITLE="${{ steps.tag.outputs.title }}"
          PRERELEASE_FLAG=""
          if [[ "${{ steps.tag.outputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Delete an existing release with the same tag (rolling nightly case)
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true

          # Create fresh release and upload all ISO artifacts
          gh release create "${TAG}" \
            --title "${TITLE}" \
            --generate-notes \
            ${PRERELEASE_FLAG} \
            iso-artifacts/*

          echo "✅ Released ${TAG} with files:"
          gh release view "${TAG}" --json assets --jq '.assets[].name'
