# ============================================================================
# LinkOS — Calamares welcome module
# Shows a welcome screen with requirements check.
# ============================================================================

# Show language selector + release notes URL
showLanguageSelector: true
showReleaseNotesUrl: false

# Requirements check — refuse to install if these aren't met
requirements:
  requiredStorage: 20.0        # GB
  requiredRam: 2.0             # GB
  internetCheckUrl: https://archlinux.org
  required:
    - storage
    - ram
    - internet
  check:
    - storage
    - ram
    - power
    - internet
    - root

# Support URLs (visible in welcome screen)
supportUrl:
  - name: Documentation
    url: https://github.com/salom600/link/wiki
  - name: Issue Tracker
    url: https://github.com/salom600/link/issues
  - name: Source Code
    url: https://github.com/salom600/link
