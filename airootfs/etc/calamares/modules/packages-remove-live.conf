# ============================================================================
# LinkOS — Calamares packages module (remove live-only packages)
# Removes live-environment-only packages from the target after install.
# ============================================================================

backend: pacman
update_db: false

operations:
  - remove:
      - calamares
      - calamares-core
      - archiso
      - mkarchiso
      - arch-install-scripts

  - try_remove:
      - live-tools
      - linkos-install
