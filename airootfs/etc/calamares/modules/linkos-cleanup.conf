# ============================================================================
# LinkOS — Calamares shellprocess module (linkos-cleanup)
# Cleanup operations before umount.
# ============================================================================

dontChroot: false

script:
  # Clear pacman cache
  - "-yes | pacman -Scc --noconfirm || true"
  # Remove build artifacts
  - "-rm -rf /var/cache/pacman/pkg/* || true"
  - "-rm -rf /var/lib/pacman/sync/* || true"
  # Clean up tmp
  - "-rm -rf /tmp/* || true"
  - "-rm -rf /var/tmp/* || true"
  # Remove live-only files
  - "-rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf"
  - "-rm -f /etc/lightdm/lightdm.conf.d/10-linkos-autologin.conf"
  - "-rm -f /usr/local/bin/linkos-install"
  - "-rm -f /home/linkos/Desktop/linkos-install.desktop"
  # Reset user password if it was the default live one
  - "-passwd -l root 2>/dev/null || true"
  # Final cleanup
  - "-journalctl --vacuum-time=0 2>/dev/null || true"
  - "-rm -f /var/log/journal/* 2>/dev/null || true"
  # Update databases one last time
  - "-update-desktop-database /usr/share/applications"
  - "-update-mime-database /usr/share/mime 2>/dev/null || true"
  - "-gtk-update-icon-cache -f /usr/share/icons/Fluent-Dark/ 2>/dev/null || true"
  - "-fc-cache -f"

failOnFailedCommand: false
