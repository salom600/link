# ============================================================================
# LinkOS — Calamares bootloader module
# Installs GRUB to the target disk.
# ============================================================================

# Bootloader to install
brand: "GRUB"

# EFI support
efi: true

# Install location (empty = use the partition chosen by partition module)
installPath: ""

# Use boot-partition label
useBootPrefix: true

# Don't probe for other OSes (set true to enable os-prober)
enableOsProber: true
