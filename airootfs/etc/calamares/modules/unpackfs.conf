# ============================================================================
# LinkOS — Calamares unpackfs module
# Copies the live environment to the target disk.
# ============================================================================

# Source: the squashfs root from the live medium
unpack:
  - source: /run/archiso/bootmnt/arch/x86_64/airootfs.sfs
    sourcefs: squashfs
    destination: ""

  # Optional: desktopfs squashfs (layered ISO)
  - source: /run/archiso/bootmnt/arch/x86_64/desktopfs.sfs
    sourcefs: squashfs
    destination: ""

# Don't try to unpack these (would conflict with target)
# exclude: []

# Weight — affects threading
weight: 10
