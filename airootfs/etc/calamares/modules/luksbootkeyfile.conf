# ============================================================================
# LinkOS — Calamares luksbootkeyfile module
# Sets up a keyfile for LUKS-encrypted root (auto-unlock at boot).
# ============================================================================

# Filename for the keyfile
keyfile: "/crypto_keyfile.bin"

# Size of the keyfile (in bytes)
keyfileSize: 8192

# Whether to warn if no LUKS partitions exist
warnIfNoLUKS: true
