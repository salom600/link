# ============================================================================
# LinkOS — Calamares services-systemd module
# Enables/disables systemd services on the target system.
# ============================================================================

# Services to enable on the installed system
services:
  enabled:
    - NetworkManager
    - lightdm
    - bluetooth
    - systemd-timesyncd
    - systemd-resolved
    - cups
    - firewalld
    - reflector.timer
    - paccache.timer
    - ufw
    - tlp
  disabled:
    - systemd-networkd
    - systemd-networkd-wait-online
    - dhcpcd
    - rpcbind
