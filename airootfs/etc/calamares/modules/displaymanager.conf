# ============================================================================
# LinkOS — Calamares displaymanager module
# Configures LightDM on the target system.
# ============================================================================

# Display manager to configure
displaymanagers:
  - lightdm

# Don't autologin on the installed system (security best practice)
# Set to "true" if you want autologin (user-friendly, less secure)
autologin: false

# Set the default session
defaultDesktopEnvironment:
  executable: "startxfce4"
  desktopFile: "xfce"

# Whether to ask before setting autologin
basicSetup: false

# Enable the display manager service
sysconfigSetup: false
