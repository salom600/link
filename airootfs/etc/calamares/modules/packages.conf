# ============================================================================
# LinkOS — Calamares packages module (install)
# Runs `pacman` on the target system to install extra packages.
# ============================================================================

# Package manager to use
backend: pacman

# Whether to update the target's package database first
update_db: true

# Whether to skip_if_unavailable
skip_if_unavailable: true

# pacman operations
operations:
  - install:
      # Already in ISO — re-install on target to refresh
      - base
      - base-devel
      - linux
      - linux-headers
      - linux-firmware
      - efibootmgr
      - grub
      - os-prober
      - intel-ucode
      - amd-ucode
      - networkmanager
      - lightdm
      - lightdm-gtk-greeter
      - xfce4
      - xfce4-goodies
      - polybar
      - rofi
      - picom
      - dunst
      - brave-bin
      - flatpak
      - steam
      - wine
      - winetricks
      - lutris
      - gamemode
      - mangohud
      - gamescope
      - proton-ge-custom

  - try_install:
      # Optional AUR — only if chaotic-aur or AUR helper is available
      - heroic-games-launcher-bin
