# ============================================================================
# LinkOS — Calamares shellprocess module (linkos-postinstall)
# Runs a post-install script on the target system after unpackfs + users.
# ============================================================================

# Don't show the script output to the user
dontChroot: false

# Run in the target's shell (chroot)
script:
  - "-mkdir -p /etc/calamares-postinstall"
  - "-touch /etc/calamares-postinstall/.linkos-installed"
  - "-systemctl enable NetworkManager"
  - "-systemctl enable lightdm"
  - "-systemctl enable bluetooth"
  - "-systemctl enable cups"
  - "-systemctl enable firewalld"
  - "-systemctl enable reflector.timer"
  - "-systemctl enable paccache.timer"
  - "-systemctl enable ufw"
  - "-systemctl enable tlp"
  - "-systemctl disable dhcpcd"
  - "-systemctl disable systemd-networkd"
  # Create user's home directories
  - "-xdg-user-dirs-update"
  - "-su -l ${USER} -c 'xdg-user-dirs-update'"
  # Apply Fluent Dark theme for the new user
  - "-su -l ${USER} -c '/usr/local/bin/apply-theme.sh' || true"
  # Set up Flatpak Flathub
  - "-flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo || true"
  # Disable SSH by default on installed system
  - "-systemctl disable sshd || true"
  # Generate SSH host keys
  - "-ssh-keygen -A"
  # Rebuild initramfs (in case NVIDIA modules were installed)
  - "-mkinitcpio -P"
  # Update GRUB
  - "-grub-mkconfig -o /boot/grub/grub.cfg"
  # Update pacman mirrorlist
  - "-reflector --latest 30 --protocol https --sort rate --save /etc/pacman.d/mirrorlist || true"
  # Final: update desktop database, icon cache
  - "-update-desktop-database /usr/share/applications"
  - "-gtk-update-icon-cache /usr/share/icons/Fluent-Dark/ || true"
  - "-xdg-mime default brave.desktop x-scheme-handler/http"
  - "-xdg-mime default brave.desktop x-scheme-handler/https"

# Failure modes:
#   - "continue" — keep going even if a command fails (because of leading "-")
#   - "abort"    — abort on first failure
failOnFailedCommand: false
