# ============================================================================
# LinkOS — Calamares partition module
# Defines partitioning options shown to the user.
# ============================================================================

# Default filesystem type for the install
defaultFileSystemType: "btrfs"

# Available filesystems in the dropdown
availableFileSystems:
  - btrfs
  - ext4
  - ext3
  - ext2
  - xfs
  - f2fs
  - jfs
  - reiserfs

# Partitioning schemes (side panel)
partitionLayout:
  - name: "Erase disk"
    description: "Erase the entire disk and install LinkOS (recommended for new users)."
    type: "erase"
    fs: "btrfs"
    partitions:
      - mountPoint: "/"
        fs: "btrfs"
        size: 100%
        subvolumes:
          - name: "@"
            mountPoint: "/"
          - name: "@home"
            mountPoint: "/home"
          - name: "@root"
            mountPoint: "/root"
          - name: "@srv"
            mountPoint: "/srv"
          - name: "@cache"
            mountPoint: "/var/cache"
          - name: "@log"
            mountPoint: "/var/log"
          - name: "@tmp"
            mountPoint: "/tmp"
      - mountPoint: "/boot/efi"
        fs: "fat32"
        size: 512M
        boot: true

  - name: "Replace a partition"
    description: "Replace a partition with LinkOS. Keeps other partitions intact."
    type: "replace"

  - name: "Manual partitioning"
    description: "Manually configure partitions. For advanced users."
    type: "manual"

# Allow these device types as install targets
allowZfs: false
allowLuks: true
allowBtrfs: true
allowManual: true

# Required partitions — installation refuses to continue without these
requiredPartitions:
  - "/"
  - "/boot/efi"   # required for UEFI

# efiSystemPartition settings
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: "EFI"

# Swap
userSwapChoices:
  - none
  - small
  - suspend
  - file

# Ensure bootloader has a place to install
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
initialSwapChoice: small
