# ============================================================================
# LinkOS — Calamares grubcfg module
# Writes /etc/default/grub on the target system.
# ============================================================================

# Overwrite the existing /etc/default/grub
overwrite: true

# Keep distribution-specific defaults
keepDistributor: true

# Default GRUB settings — already created by customize_airootfs.sh,
# but we re-apply here in case the user changed language/keyboard.
defaults:
    GRUB_TIMEOUT: "5"
    GRUB_DEFAULT: "0"
    GRUB_DISABLE_SUBMENU: "true"
    GRUB_DISABLE_RECOVERY: "true"
    GRUB_CMDLINE_LINUX_DEFAULT: "loglevel=3 quiet nvidia_drm.modeset=1 mitigations=off"
    GRUB_CMDLINE_LINUX: ""
    GRUB_TERMINAL_INPUT: "console"
    GRUB_GFXMODE: "auto"
    GRUB_GFXPAYLOAD_LINUX: "keep"
    GRUB_ENABLE_CRYPTODISK: "y"
    GRUB_DISABLE_OS_PROBER: "false"
    GRUB_THEME: "/boot/grub/themes/linkos/theme.txt"
