# ============================================================================
# LinkOS — Calamares users module
# Creates the user account on the target system.
# ============================================================================

# Default user settings
defaultGroups:
  - name: wheel
    description: "Administrator group (sudo)"
  - name: audio
    description: "Audio devices"
  - name: video
    description: "Video devices"
  - name: optical
    description: "Optical drives"
  - name: storage
    description: "Storage devices"
  - name: network
    description: "NetworkManager"
  - name: power
    description: "Power management"
  - name: lp
    description: "Printers"
  - name: games
    description: "Games (Steam, Lutris)"

# Auto-login
doAutologin: true

# Set root password (prompt user)
setRootPassword: true

# Allow weak passwords (with warning)
allowWeakPasswords: false

# Validate hostname format
doPasswordCheck: true

# User shell
userShell: /bin/zsh

# Default user name suggestion
username: linkos

# Home directory permissions
homeDirPermissions: 0700

# Skeleton directory to copy into the new user's home
userSkelDir: /etc/skel

# Full name default
fullName: ""

# Require strong passwords
passwordStrength: 1

# Show "Reuse password for root" option
reusePassword: true
