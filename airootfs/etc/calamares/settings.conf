# ============================================================================
# LinkOS — Calamares main settings
# ----------------------------------------------------------------------------
# Defines the sequence of modules executed during installation.
# Designed for an XFCE + LightDM desktop on Arch Linux.
# ============================================================================

# Branding file (looks in /etc/calamares/branding/linkos/)
branding: linkos

# Modules sequence — order matters. Each entry is either:
#   - A module name (executes the module's "exec" phase)
#   - A name + "show" modifier (only shows in summary, doesn't run)
sequence:
  - show:
    - welcome
    - locale
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - packages
    - luksbootkeyfile
    - luksopenswaphook
    - shellprocess@linkos-postinstall
    - initramfs
    - grubcfg
    - bootloader
    - packages@remove-live
    - shellprocess@linkos-cleanup
    - preservefiles
    - umount
  - show:
    - finished

# Default module instances — name:instance
instances:
  - id:       linkos-postinstall
    module:   shellprocess
    config:   linkos-postinstall.conf
  - id:       linkos-cleanup
    module:   shellprocess
    config:   linkos-cleanup.conf
  - id:       remove-live
    module:   packages
    config:   packages-remove-live.conf

# Where to look for module-specific config files
modules-search: local

# Don't show the "are you sure you want to install?" prompt
prompt-install: false

# Don't quit Calamares on back-button
quit-poweroff: false
