# ============================================================================
# LinkOS — LightDM configuration
# Uses lightdm-gtk-greeter with Fluent Dark theme.
# Autologin is configured in /etc/lightdm/lightdm.conf.d/10-linkos-autologin.conf
# (created at build time by customize_airootfs.sh).
# ============================================================================

[LightDM]
run-directory=/run/lightdm
greeter-user=lightdm
user-authority=/var/lib/lightdm/authority
log-directory=/var/log/lightdm
sessions-directory=/usr/share/lightdm/sessions:/usr/share/xsessions:/usr/share/wayland-sessions
remote-sessions-directory=/usr/share/lightdm/remote-sessions
greeters-directory=/usr/share/xgreeters

[Seat:*]
greeter-session=lightdm-gtk-greeter
user-session=xfce
session-wrapper=/etc/lightdm/Xsession
allow-guest=false
greeter-show-manual-login=false
greeter-hide-users=false
hide-users=false
display-setup-script=
session-setup-script=
session-cleanup-script=
autologin-user=
autologin-user-timeout=0
autologin-in-background=false
autologin-session=
pam-service=lightdm
pam-autologin-service=lightdm-autologin

[XDMCPServer]
enabled=false
port=177
listen-address=
key=

[VNCServer]
enabled=false
command=Xvnc
port=5900
listen-address=
width=1024
height=768
depth=8
