# ============================================================================
# LinkOS — Polybar configuration
# Windows 11-style top bar: workspace, current window, system tray, clock.
# ============================================================================

[colors]
background          = #1f1f1fee
background-alt      = #2a2a2aee
foreground          = #e6e6e6ff
foreground-alt      = #888888ff
primary             = #4cc2ffff
secondary           = #9b59b6ff
alert               = #e74c3cff
success             = #2ecc71ff
warning             = #f1c40fff
accent              = #4cc2ffff
border              = #4cc2ff30
window              = #1f1f1fff
fluent-blue         = #60cdffff
fluent-purple       = #b146c2ff
fluent-pink         = #ff579aff
fluent-green        = #6ffb9fff
fluent-orange       = #ff8c42ff

[bar/linkos]
width               = 100%
height              = 30
radius              = 0
fixed-center        = true
bottom              = false

background          = ${colors.background}
foreground          = ${colors.foreground}

line-size           = 0
line-color          = ${colors.accent}

border-size         = 0
border-color        = ${colors.border}

padding-left        = 6
padding-right       = 6

module-margin-left  = 4
module-margin-right= 4

font-0              = "Cascadia Code:size=10;2"
font-1              = "Noto Sans:size=10;2"
font-2              = "Noto Color Emoji:size=10;2"
font-3              = "FontAwesome:size=10;2"

modules-left        = i3 xworkspaces xwindow
modules-center      = date
modules-right       = pulseaudio memory cpu temperature wlan eth battery powermenu

tray-position       = right
tray-padding        = 4
tray-background     = ${colors.background}
tray-maxsize        = 18

cursor-click        = pointer
cursor-scroll       = ns-resize

enable-ipc          = true

wm-restack          = i3
override-redirect   = false

[module/i3]
type                = internal/i3
pin-workspaces      = true
show-urgent         = true
strip-wsnumbers     = true
index-sort          = true
enable-click        = true
enable-scroll       = false
wrapping-scroll     = false
reverse-scroll      = false
fuzzy-match         = true

[module/xworkspaces]
type                = internal/xworkspaces
label-active        = %name%
label-active-background = ${colors.fluent-blue}
label-active-foreground = ${colors.background}
label-active-padding   = 2
label-occupied      = %name%
label-occupied-padding = 2
label-urgent         = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding   = 2
label-empty          = %name%
label-empty-foreground = ${colors.foreground-alt}
label-empty-padding   = 2
label-monitor        = %name%

[module/xwindow]
type                = internal/xwindow
label               = %title:0:60:...%
label-foreground    = ${colors.fluent-blue}

[module/date]
type                = internal/date
interval            = 1.0
time                = "%a, %d %b   %H:%M"
time-alt            = "%H:%M:%S   %Y-%m-%d"
label               = %time%
label-foreground    = ${colors.fluent-blue}
label-padding       = 2

[module/pulseaudio]
type                = internal/pulseaudio
format-volume       = <ramp-volume> <label-volume>
format-volume-foreground = ${colors.fluent-blue}
label-volume        = %percentage%%
label-volume-foreground = ${colors.foreground}
label-muted         = MUTED
label-muted-foreground = ${colors.warning}
ramp-volume-0       = 🔈
ramp-volume-1       = 🔉
ramp-volume-2       = 🔊

[module/memory]
type                = internal/memory
interval            = 2
format-prefix       = "RAM "
format-prefix-foreground = ${colors.fluent-green}
label               = %percentage_used:2%%
label-foreground    = ${colors.foreground}

[module/cpu]
type                = internal/cpu
interval            = 2
format-prefix       = "CPU "
format-prefix-foreground = ${colors.fluent-orange}
label               = %percentage:2%%
label-foreground    = ${colors.foreground}

[module/temperature]
type                = internal/temperature
interval            = 5
thermal-zone        = 0
warn-temperature    = 75
format              = <ramp> <label>
format-warn         = <ramp> <label-warn>
label               = %temperature-c%
label-warn          = %temperature-c%
label-warn-foreground = ${colors.alert}
ramp-0              = "🌡"
ramp-1              = "🔥"
ramp-2              = "🌋"

[module/wlan]
type                = internal/network
interface           = wlan0
interval            = 3.0
format-connected    = <ramp-signal> <label-connected>
format-connected-foreground = ${colors.fluent-purple}
label-connected     = %essid% %signal%%
label-disconnected  = "wifi off"
label-disconnected-foreground = ${colors.foreground-alt}
ramp-signal-0       = 📶
ramp-signal-1       = 📶
ramp-signal-2       = 📶
ramp-signal-3       = 📶
ramp-signal-4       = 📶

[module/eth]
type                = internal/network
interface           = eth0
interval            = 3.0
format-connected    = <label-connected>
format-connected-foreground = ${colors.fluent-purple}
label-connected     = %local_ip%
label-disconnected  = "eth off"
label-disconnected-foreground = ${colors.foreground-alt}

[module/battery]
type                = internal/battery
full-at             = 98
battery             = BAT0
adapter             = ADP1
poll-interval       = 5
format-charging     = <ramp-capacity> <label-charging>
format-charging-foreground = ${colors.fluent-green}
format-discharging  = <ramp-capacity> <label-discharging>
format-discharging-foreground = ${colors.fluent-orange}
format-full         = <ramp-capacity> <label-full>
format-full-foreground = ${colors.success}
label-charging      = %percentage%%
label-discharging   = %percentage%%
label-full          = Full
ramp-capacity-0     = 🔴
ramp-capacity-1     = 🟠
ramp-capacity-2     = 🟡
ramp-capacity-3     = 🟢
ramp-capacity-4     = 🟢

[module/powermenu]
type                = custom/menu
expand-right        = true
format-spacing      = 1
label-open          = ⏻
label-open-foreground = ${colors.alert}
label-close         = ✕
label-close-foreground = ${colors.foreground}
menu-0-0            = reboot
menu-0-0-exec       = menu-open-1
menu-0-1            = power off
menu-0-1-exec       = menu-open-2
menu-1-0            = confirm
menu-1-0-exec       = systemctl reboot
menu-1-1            = cancel
menu-1-1-exec       = menu-open-0
menu-2-0            = confirm
menu-2-0-exec       = systemctl poweroff
menu-2-1            = cancel
menu-2-1-exec       = menu-open-0

[settings]
screenchange-reload = true
compositing-background = source
compositing-foreground = over
compositing-overline   = over
compositing-underline  = over
compositing-border     = over
pseudo-transparency    = false

# ─────────────────────── Second bar (bottom dock-like) ─────────────────────
[bar/linkos-dock]
width               = 50%
height              = 50
offset-x            = 25%
offset-y            = 95%
bottom              = true
fixed-center        = true
radius              = 12
background          = ${colors.background}
foreground          = ${colors.foreground}
border-size         = 0
padding-left        = 4
padding-right       = 4
module-margin-left  = 2
module-margin-right = 2

font-0              = "Cascadia Code:size=11;3"
font-1              = "Noto Sans:size=11;3"
font-2              = "Noto Color Emoji:size=11;3"
font-3              = "FontAwesome:size=11;3"

modules-center      = launcher1 launcher2 launcher3 launcher4 launcher5 launcher6 launcher7 launcher8 launcher9

[module/launcher1]
type                = custom/text
content             = 🚀
content-foreground  = ${colors.fluent-blue}
click-left          = rofi -show drun -theme linkos

[module/launcher2]
type                = custom/text
content             = 🌐
content-foreground  = ${colors.fluent-blue}
click-left          = brave

[module/launcher3]
type                = custom/text
content             = 📁
content-foreground  = ${colors.fluent-purple}
click-left          = thunar

[module/launcher4]
type                = custom/text
content             = ⚙
content-foreground  = ${colors.fluent-orange}
click-left          = xfce4-settings-manager

[module/launcher5]
type                = custom/text
content             = 🎮
content-foreground  = ${colors.fluent-pink}
click-left          = lutris

[module/launcher6]
type                = custom/text
content             = 🎮
content-foreground  = ${colors.fluent-green}
click-left          = steam

[module/launcher7]
type                = custom/text
content             = 🖥
content-foreground  = ${colors.fluent-purple}
click-left          = xfce4-terminal

[module/launcher8]
type                = custom/text
content             = 🎵
content-foreground  = ${colors.fluent-orange}
click-left          = spotify || ytmdesktop

[module/launcher9]
type                = custom/text
content             = 📷
content-foreground  = ${colors.fluent-green}
click-left          = flameshot gui
