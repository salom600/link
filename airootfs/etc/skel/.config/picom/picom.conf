# ============================================================================
# LinkOS — Picom compositor configuration
# Provides Windows 11-style transparency, blur, and rounded corners.
# ============================================================================

# ───────────────────────── Backend ─────────────────────────
backend = "glx";                  # Use OpenGL — better with NVIDIA
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;

# ───────────────────────── Shadows ─────────────────────────
shadow = true;
shadow-radius = 12;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-opacity = 0.55;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-dock'",
    "class_g = 'dwm'",
    "class_g = 'Polybar'",
    "class_g = 'rofi'",
    "_GTK_FRAME_EXTENTS@:c",
    "window_type = 'desktop'",
    "window_type = 'dock'"
];
shadow-ignore-shaped = false;

# ───────────────────────── Corners (rounded) ─────────────────────────
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'popup'",
    "window_type = 'dropdown_menu'",
    "window_type = 'tooltip'",
    "class_g = 'Polybar'",
    "class_g = 'dwm'"
];

# ───────────────────────── Fading ─────────────────────────
fading = true;
fade-delta = 6;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-exclude = [
    "class_g = 'dwm'",
    "class_g = 'Polybar'",
    "window_type = 'desktop'"
];

# ───────────────────────── Blur (Windows 11 acrylic-style) ─────────────────────────
blur: {
    method = "dual_kawase";
    strength = 8;
    background = false;
    background-frame = false;
    background-fixed = false;
    kern = "3x3box";
};

blur-background-exclude = [
    "window_type = 'desktop'",
    "window_type = 'popup_menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'tooltip'",
    "class_g = 'Polybar'",
    "class_g = 'dwm'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ───────────────────────── Opacity rules ─────────────────────────
opacity-rule = [
    "85:class_g = 'xfce4-terminal'",
    "85:class_g = 'Alacritty'",
    "85:class_g = 'kitty'",
    "85:class_g = 'URxvt'",
    "90:class_g = 'Thunar'",
    "90:class_g = 'Code'",
    "92:class_g = 'firefox'",
    "92:class_g = 'Brave-browser'",
    "85:class_g = 'Rofi'",
    "100:name = 'Zoom'",
    "100:class_g = 'Steam'"
];

# ───────────────────────── Inactive window dim ─────────────────────────
inactive-dim = 0.06;
inactive-dim-fixed = true;

# ───────────────────────── Focus ─────────────────────────
focus-exclude = [
    "class_g = 'dwm'",
    "class_g = 'Polybar'",
    "window_type = 'desktop'",
    "class_g = 'rofi'",
    "class_g = 'Rofi'"
];

# ───────────────────────── Misc ─────────────────────────
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# Xinerama screen offset fix
xinerama-shadow-crop = true;

# Window type settings
wintypes: {
    tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.95; };
    dropdown_menu = { opacity = 0.95; };
    notification = { fade = true; shadow = true; opacity = 0.95; };
    toolbar = { fade = true; shadow = true; };
    splash = { fade = true; shadow = true; };
    dialog = { fade = true; shadow = true; };
    normal = { fade = true; shadow = true; };
    utility = { fade = true; shadow = true; };
};

# Performance tuning
refresh-rate = 0;
sw-opti = false;
