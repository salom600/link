# ============================================================================
# LinkOS — NVIDIA UEFI boot entry
# For systems where NVIDIA proprietary drivers are needed at boot
# ============================================================================

title   🎮 LinkOS with NVIDIA (UEFI)
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd  /%INSTALL_DIR%/boot/intel-ucode.img
initrd  /%INSTALL_DIR%/boot/amd-ucode.img
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G nvidia_drm.modeset=1
