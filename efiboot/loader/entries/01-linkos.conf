# ============================================================================
# LinkOS — Default UEFI boot entry
# Uses archisosearchuuid (modern archiso) instead of archisolabel.
# %ARCH% and %INSTALL_DIR% are substituted by mkarchiso at build time.
# ============================================================================

title    🚀 LinkOS (%ARCH%, UEFI)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/intel-ucode.img
initrd   /%INSTALL_DIR%/boot/amd-ucode.img
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G
