# ============================================================================
# LinkOS — Fallback / Safe-mode UEFI boot entry
# ============================================================================

title   🛠️ LinkOS Safe Mode (UEFI, fallback initramfs)
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd  /%INSTALL_DIR%/boot/intel-ucode.img
initrd  /%INSTALL_DIR%/boot/amd-ucode.img
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux-fallback.img
options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G
