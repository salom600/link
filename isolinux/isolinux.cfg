# ============================================================================
# LinkOS — ISOLINUX configuration (Legacy BIOS boot)
# ============================================================================

UI vesamenu.c32
MENU TITLE LinkOS Live/Install Media
MENU BACKGROUND /splash.png
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033ccff #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std
MENU Color timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std
MENU COLOR msg07        37;40   #90ffffff #a0000000 std
MENU COLOR tabmsg       31;40   #30ffffff #00000000 std

MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 6
MENU VSHIFT 10
MENU TIMEOUTROW 16
MENU TABMSGROW 14
MENU CMDLINEROW 14
MENU HELPMSGROW 18
MENU HELPMSGENDROW -1

MENU AUTOBOOT Booting LinkOS in # second{,s}...

TIMEOUT 50
DEFAULT linkos

# ─────────────────────────── Boot entries ───────────────────────────

LABEL linkos
    MENU LABEL 🚀 LinkOS (x86_64, BIOS)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G copytoram=n

LABEL linkos_nvidia
    MENU LABEL 🎮 LinkOS with NVIDIA drivers (nomodeset)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G nomodeset nvidia_drm.modeset=1

LABEL linkos_safe
    MENU LABEL 🛠️ LinkOS Safe Mode (fallback initramfs)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux-fallback.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G

LABEL linkos_ram
    MENU LABEL 💾 LinkOS (Load to RAM — slower boot, faster runtime)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G copytoram=y

LABEL hdt
    MENU LABEL 🔍 Hardware Detection Tool (HDT)
    COM32 hdt.c32

LABEL reboot
    MENU LABEL ⟳ Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL ⏻ Power Off
    COM32 poweroff.c32
