# ============================================================================
# LinkOS - pacman.conf
# Optimized for archiso build with parallel downloads + multilib (for gaming)
#
# IMPORTANT: This file is copied into the live ISO by mkarchiso and used by
# pacman INSIDE the live environment. The CI workflow (build.yml) installs
# chaotic-keyring + chaotic-mirrorlist into the build container BEFORE running
# mkarchiso, so this file can safely reference the chaotic mirrorlist file
# (which will be present in /etc/pacman.d/ inside the container AND inside
# the ISO's airootfs after customize_airootfs.sh runs).
#
# The [linkos-local] repo is created at build time by the CI workflow at
# /repo/x86_64/ — it contains AUR-built packages (calamares, proton-ge-custom,
# etc.) that are not available in any official repo.
# ============================================================================

[options]
HoldPkg           = pacman glibc
Architecture      = auto
CheckSpace
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 8
VerbosePkgLists
Color

# --- LinkOS local repo (AUR-built packages, created by CI workflow) ---
[linkos-local]
SigLevel = Optional TrustAll
Server = file:///repo/$arch

# --- Core Arch repos ---
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# --- chaotic-aur: pre-built AUR packages ---
# Provides: brave-bin, heroic-games-launcher-bin, proton-ge-custom, etc.
# Pre-built AUR packages — saves ~1-2 hours of AUR compilation during CI.
# Keyring is installed at build time by .github/workflows/build.yml.
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist

