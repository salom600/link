# ============================================================================
# LinkOS - pacman.conf
# Optimized for archiso build with parallel downloads + multilib (for gaming)
#
# IMPORTANT: This file is used by mkarchiso's `pacstrap -r $newroot`.
# pacstrap does NOT resolve `Include` directives relative to the host —
# it runs `pacman -r $newroot --config=$pacman_config`, which means any
# `Include = /etc/pacman.d/foo` directive is resolved INSIDE THE CHROOT.
# Since the chroot doesn't have /etc/pacman.d/chaotic-mirrorlist or /repo/
# pre-populated, those repos would silently fail to load.
#
# Solution: use absolute `Server =` URLs (no Include, no file:// paths that
# depend on chroot-local files). The CI workflow pre-builds AUR packages
# and places them in /repo/x86_64/ on the HOST; we then use bind mounts
# (handled by mkarchiso) or copy them into the chroot at install time.
#
# Actually, the simplest approach: pre-copy the chaotic-mirrorlist file
# into the chroot via airootfs/etc/pacman.d/, AND copy the local repo
# packages into /repo/x86_64/ inside the chroot via a hook.
# But that's complex. Instead, we just hard-code the Server URLs here.
# ============================================================================

[options]
HoldPkg           = pacman glibc
Architecture      = auto
CheckSpace
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 8
VerbosePkgLists
Color

# --- LinkOS local repo (AUR-built packages, created by CI workflow) ---
# This file:// URL works because mkarchiso bind-mounts /repo into the chroot
# at install time (via _pacstrap_options -c for host cache + the fact that
# pacstrap runs pacman with -r but the host's /repo remains accessible).
#
# If this fails, the CI workflow also copies /repo/x86_64/*.pkg.tar.zst into
# /var/cache/pacman/pkg/ on the host, which is the host cache that pacstrap
# inherits via the -c flag.
[linkos-local]
SigLevel = Optional TrustAll
Server = file:///repo/$arch

# --- Core Arch repos ---
[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
# Backup mirrors (pacman uses them in order if the primary fails)
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://mirror.f4st.host/archlinux/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://mirror.f4st.host/archlinux/$repo/os/$arch

[multilib]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://mirror.f4st.host/archlinux/$repo/os/$arch

# --- chaotic-aur: pre-built AUR packages ---
# Provides: brave-bin, heroic-games-launcher-bin, protonup-qt, lutris, etc.
# Pre-built AUR packages — saves ~1-2 hours of AUR compilation during CI.
# Keyring is installed at build time by .github/workflows/build.yml.
#
# NOTE: cdn-mirror.chaotic.cx returns HTTP 303 redirects to
# builds.garudalinux.org. Pacman sometimes fails to follow these redirects
# in the mkarchiso chroot environment, so we list the direct origin URL
# FIRST to avoid the redirect dance.
#
# pacman appends `/$repo.db.tar.zst` to Server URLs to fetch the db.
# So Server = https://builds.garudalinux.org/repos/chaotic-aur/$arch
# fetches   = https://builds.garudalinux.org/repos/chaotic-aur/x86_64/chaotic-aur.db.tar.zst
[chaotic-aur]
SigLevel = Optional TrustedOnly
Server = https://builds.garudalinux.org/repos/chaotic-aur/$arch
Server = https://cdn-mirror.chaotic.cx/$repo/$arch
Server = https://geo-mirror.chaotic.cx/$repo/$arch

