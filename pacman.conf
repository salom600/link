# ============================================================================
# LinkOS - pacman.conf
# Optimized for archiso build with parallel downloads + multilib (for gaming)
# ============================================================================

[options]
HoldPkg           = pacman glibc
Architecture      = auto
CheckSpace
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 8
DownloadTimeout   = 60
VerbosePkgLists
Color
DisableDownloadTimeout

# --- Core Arch repos ---
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# --- AUR helpers / pre-built (only available inside live build via paru/yay) ---
# These are not used by pacman directly, but referenced by calamares post-install.

[chaotic-aur]
SigLevel = Never
Server = https://cdn-mirror.chaotic.cx/$repo/$arch
# Provides: brave-bin, heroic-games-launcher-bin, proton-ge-custom, etc.
# Pre-built AUR packages — saves ~1-2 hours of AUR compilation during CI.

# --- Custom LinkOS repo (optional, can host pre-built themes) ---
[linkos]
SigLevel = Optional TrustAll
Server = file:///repo/$arch
